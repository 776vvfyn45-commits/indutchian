<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="600" height="180" role="img" aria-label="Indutchian logo">
  <style>@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700');
    .wm{font-family:'Playfair Display','DejaVu Serif',Georgia,serif;font-weight:700}</style>
  <defs>
    <linearGradient id="india" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#F26722"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#138808"/>
    </linearGradient>
    <linearGradient id="dutch" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#AE1C28"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#21468B"/>
    </linearGradient>
  </defs>
  <text class="wm" x="300" y="98" text-anchor="middle" font-size="76" fill="#FAF3E7">Indutchian</text>
  <rect x="150" y="120" width="148" height="8" rx="4" fill="url(#india)"/>
  <rect x="302" y="120" width="148" height="8" rx="4" fill="url(#dutch)"/>
</svg>
